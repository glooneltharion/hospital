<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patients</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="fragments/layout :: navbar"></div>

<div class="container py-5">

    <div class="card shadow-sm mb-5">

        <div class="card-header bg-primary text-white">
            <h2 class="mb-0"
                th:text="${patient.id} != null ? 'Edit Patient' : 'Create Patient'">
            </h2>
        </div>

        <div class="card-body">

            <form th:action="@{/patients/save}"
                  th:object="${patient}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">First name</label>
                        <input type="text"
                               th:field="*{firstName}"
                               class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last name</label>
                        <input type="text"
                               th:field="*{lastName}"
                               class="form-control">
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Birth date</label>
                        <input type="date"
                               th:field="*{birthDate}"
                               class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Gender</label>

                        <select th:field="*{gender}"
                                class="form-select">

                            <option value="">Select gender</option>

                            <option th:each="g : ${T(com.glooneltharion.hospital.models.enums.Gender).values()}"
                                    th:value="${g}"
                                    th:text="${g}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Phone number</label>

                        <input type="text"
                               th:field="*{phoneNumber}"
                               class="form-control"
                               placeholder="+421912345678">

                        <div th:if="${#fields.hasErrors('phoneNumber')}"
                             th:errors="*{phoneNumber}"
                             class="text-danger small mt-1">
                        </div>
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input type="email"
                           th:field="*{email}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>

                    <input type="text"
                           th:field="*{address}"
                           class="form-control">
                </div>

                <div class="mb-4">
                    <label class="form-label">Insurance</label>

                    <select th:field="*{insuranceCompany}"
                            class="form-select">

                        <option value="">Select insurance</option>

                        <option th:each="i : ${T(com.glooneltharion.hospital.models.enums.InsuranceCompany).values()}"
                                th:value="${i}"
                                th:text="${i.label}">
                        </option>

                    </select>
                </div>

                <button type="submit"
                        class="btn btn-primary"
                        th:text="${patient.id} != null ? 'Update' : 'Save'">
                </button>

            </form>

        </div>
    </div>


    <div class="card shadow-sm">

        <div class="card-header">
            <h2 class="mb-0">Patients</h2>
        </div>

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover table-striped mb-0">

                    <thead class="table-dark">

                    <tr>

                        <th>
                            <a th:href="@{/patients}"
                               class="text-white text-decoration-none">
                                ID
                            </a>
                        </th>

                        <th>
                            <a th:href="@{/patients(sortBy='lastName')}"
                               class="text-white text-decoration-none">
                                Name
                            </a>
                        </th>

                        <th>
                            <a th:href="@{/patients(sortBy='gender')}"
                               class="text-white text-decoration-none">
                                Gender
                            </a>
                        </th>

                        <th>
                            <a th:href="@{/patients(sortBy='insuranceCompany')}"
                               class="text-white text-decoration-none">
                                Insurance
                            </a>
                        </th>

                        <th>Actions</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="p : ${patients}">

                        <td th:text="${p.id}"></td>

                        <td th:text="${p.firstName + ' ' + p.lastName}"></td>

                        <td th:text="${p.gender}"></td>

                        <td th:text="${p.insuranceCompany != null ? p.insuranceCompany.label : 'No insurance'}"></td>

                        <td>

                            <a th:href="@{/patients/edit/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-primary">
                                Edit
                            </a>

                            <a th:href="@{/patients/delete/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-danger">
                                Delete
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
