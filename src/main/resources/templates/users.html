<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Users</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="fragments/layout :: navbar"></div>

<div class="container py-5">

  <div class="card shadow-sm mb-5">

    <div class="card-header bg-primary text-white">
      <h2 class="mb-0"
          th:text="${user.id} != null ? 'Edit User' : 'Create User'">
      </h2>
    </div>

    <div class="card-body">

      <form th:action="@{/users/save}"
            th:object="${user}"
            method="post">

        <input type="hidden" th:field="*{id}">

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label">First name</label>

            <input type="text"
                   th:field="*{firstName}"
                   class="form-control">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Last name</label>

            <input type="text"
                   th:field="*{lastName}"
                   class="form-control">
          </div>

        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>

          <input type="text"
                 th:field="*{email}"
                 class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>

          <input type="password"
                 th:field="*{password}"
                 class="form-control">
        </div>

        <div class="mb-4">
          <label class="form-label">Role</label>

          <select th:field="*{role}"
                  class="form-select">

            <option th:each="r : ${T(com.glooneltharion.hospital.models.enums.Role).values()}"
                    th:value="${r}"
                    th:text="${r}">
            </option>

          </select>
        </div>

        <button type="submit"
                class="btn btn-primary"
                th:text="${user.id} != null ? 'Update' : 'Save'">
        </button>

      </form>

    </div>
  </div>


  <div class="card shadow-sm">

    <div class="card-header">
      <h2 class="mb-0">Users</h2>
    </div>

    <div class="card-body p-0">

      <div class="table-responsive">

        <table class="table table-hover table-striped mb-0">

          <thead class="table-dark">

          <tr>

            <th>
              <a th:href="@{/users}"
                 class="text-white text-decoration-none">
                ID
              </a>
            </th>

            <th>
              <a th:href="@{/users(sortBy='lastName')}"
                 class="text-white text-decoration-none">
                Name
              </a>
            </th>

            <th>
              <a th:href="@{/users(sortBy='email')}"
                 class="text-white text-decoration-none">
                Email
              </a>
            </th>

            <th>
              <a th:href="@{/users(sortBy='role')}"
                 class="text-white text-decoration-none">
                Role
              </a>
            </th>

            <th>Actions</th>

          </tr>

          </thead>

          <tbody>

          <tr th:each="u : ${users}">

            <td th:text="${u.id}"></td>

            <td th:text="${u.firstName + ' ' + u.lastName}"></td>

            <td th:text="${u.email}"></td>

            <td>
                            <span class="badge bg-secondary"
                                  th:text="${u.role}">
                            </span>
            </td>

            <td>

              <a th:href="@{/users/edit/{id}(id=${u.id})}"
                 class="btn btn-sm btn-outline-primary">
                Edit
              </a>

              <a th:href="@{/users/delete/{id}(id=${u.id})}"
                 class="btn btn-sm btn-outline-danger">
                Delete
              </a>

            </td>

          </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>

</body>
</html>
