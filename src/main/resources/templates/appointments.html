<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5">

    <div class="card shadow-sm mb-5">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">Create Appointment</h2>
        </div>

        <div class="card-body">

            <form th:action="@{/appointments/save}"
                  th:object="${appointment}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Doctor</label>
                    <select th:field="*{doctorId}" class="form-select">
                        <option value="" disabled selected>-- Select Doctor --</option>
                        <option th:each="doctor : ${doctors}"
                                th:value="${doctor.id}"
                                th:text="${doctor.firstName + ' ' + doctor.lastName}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Patient</label>
                    <select th:field="*{patientId}" class="form-select">
                        <option value="" disabled selected>-- Select Patient --</option>
                        <option th:each="patient : ${patients}"
                                th:value="${patient.id}"
                                th:text="${patient.firstName + ' ' + patient.lastName}">
                        </option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Start</label>
                        <input type="datetime-local"
                               class="form-control"
                               name="startTime"
                               th:value="${appointment.startTime != null ?
                              #temporals.format(appointment.startTime, 'yyyy-MM-dd''T''HH:mm') : ''}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">End</label>
                        <input type="datetime-local"
                               class="form-control"
                               name="endTime"
                               th:value="${appointment.endTime != null ?
                              #temporals.format(appointment.endTime, 'yyyy-MM-dd''T''HH:mm') : ''}">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Save
                </button>

            </form>

        </div>
    </div>


    <div class="card shadow-sm">
        <div class="card-header">
            <h2 class="mb-0">Appointments</h2>
        </div>

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover table-striped mb-0">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Doctor</th>
                        <th>Patient</th>
                        <th>Status</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="a : ${appointments}">

                        <td th:text="${a.id}"></td>

                        <td th:if="${a.doctorFirstName != null}"
                            th:text="${a.doctorFirstName + ' ' + a.doctorLastName}">
                        </td>

                        <td th:if="${a.doctorFirstName == null}"
                            class="text-danger fw-bold">
                            Doctor deleted
                        </td>

                        <td th:text="${a.patientFirstName + ' ' + a.patientLastName}"></td>

                        <td>
                            <span class="badge bg-secondary"
                                  th:text="${a.status}">
                            </span>
                        </td>

                        <td th:text="${#temporals.format(a.startTime, 'dd-MM-yyyy HH:mm')}"></td>

                        <td th:text="${#temporals.format(a.endTime, 'dd-MM-yyyy HH:mm')}"></td>

                        <td>
                            <a th:href="@{/appointments/edit/{id}(id=${a.id})}"
                               class="btn btn-sm btn-outline-primary">
                                Edit
                            </a>

                            <a th:href="@{/appointments/cancel/{id}(id=${a.id})}"
                               class="btn btn-sm btn-outline-danger">
                                Cancel
                            </a>
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</div>

</body>
</html>
